[package]
name = "explorer-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
explorer-core = { path = "../core" }
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
