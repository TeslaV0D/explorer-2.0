[package]
name = "explorer2"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# GPU renderer (D-009): Skia today; FemtoVG is evaluated (smaller exe, D-015: only if nothing gets worse)
default = ["gpu-skia"]
gpu-skia = ["slint/renderer-skia-opengl"]
gpu-femtovg = ["slint/renderer-femtovg"]

[dependencies]
explorer-core = { path = "../core" }
explorer-integrate = { path = "../integrate" }
explorer-fs = { path = "../fs" }
explorer-gpu = { path = "../gpu" }
explorer-ops = { path = "../ops" }
explorer-shell = { path = "../shell" }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1"
embed-resource = "3"
