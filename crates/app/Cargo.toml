[package]
name = "explorer2"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
explorer-core = { path = "../core" }
explorer-fs = { path = "../fs" }
explorer-gpu = { path = "../gpu" }
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-skia-opengl", "renderer-software"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Console"] }

[build-dependencies]
slint-build = "1"
embed-resource = "3"
