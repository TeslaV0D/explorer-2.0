<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6ECF5"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0A92B"/>
      <stop offset="1" stop-color="#D98E14"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD75E"/>
      <stop offset="1" stop-color="#FFC23A"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BF5"/>
      <stop offset="1" stop-color="#1A5FD6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B2A5B" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Apple-Files-style tile -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#tile)" stroke="#CBD5E1" stroke-width="2"/>
  <g filter="url(#shadow)">
    <!-- back of folder with tab -->
    <path d="M44 78 q0-12 12-12 h44 q7 0 11 5 l11 13 h78 q12 0 12 12 v96 q0 12-12 12 H56 q-12 0-12-12 z" fill="url(#back)"/>
    <!-- paper sheet peeking out -->
    <rect x="58" y="94" width="140" height="70" rx="6" fill="#FFFFFF" opacity="0.95"/>
    <!-- front panel (slight perspective) -->
    <path d="M38 118 q0-10 10-10 h160 q10 0 10 10 l-6 74 q-1 12-13 12 H57 q-12 0-13-12 z" fill="url(#front)"/>
    <!-- Windows-11-style blue band -->
    <path d="M42.6 170 h170.8 l-1.9 22 q-1 12-13 12 H57 q-12 0-13-12 z" fill="url(#band)"/>
    <!-- forward chevrons: "2.0" / speed -->
    <path d="M118 177 l10 10 l-10 10" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M134 177 l10 10 l-10 10" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <!-- highlight on front edge -->
    <path d="M48 110.5 h160" stroke="#FFF1C4" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
