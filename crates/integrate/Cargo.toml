[package]
name = "explorer-integrate"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows integration with a one-button reset (R-001): journal, apply, reset, recovery"

[dependencies]
explorer-i18n = { path = "../i18n" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
