name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux UI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Benchmark 100k folder (budgets from PLAN-BASICS)
        run: cargo run --release -p explorer-fs --example bench -- --files 100000 --runs 5 --assert
  e2e-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: UI deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev xvfb xdotool imagemagick
      - run: cargo build --release -p explorer2
      - name: E2E UI test (Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/e2e.sh "$PWD/target/release/explorer2" "$RUNNER_TEMP/e2e"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: "${{ runner.temp }}/e2e/*.png" }
  build-windows-release:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p explorer2
      - name: Smoke test exe (starts, prints version, manifest embedded)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/release/explorer2.exe").Path
          # GUI-subsystem exe: PowerShell does not wait for it, so use Start-Process -Wait
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\ver.txt"
          $out = (Get-Content "$env:RUNNER_TEMP\ver.txt" -Raw).Trim()
          if ($p.ExitCode -ne 0 -or $out -notmatch '^explorer2 \d+\.\d+\.\d+') { throw "bad --version (exit $($p.ExitCode)): '$out'" }
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          foreach ($needle in 'PerMonitorV2','longPathAware') {
            if (-not $text.Contains($needle)) { throw "manifest missing: $needle" }
          }
          "$out; size=$((Get-Item $exe).Length) bytes"
      - name: UI smoke test (real window, 100k folder, Windows fast path)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\big"
          cargo run --release -q -p explorer-fs --example bench -- --create-in $dir --files 100000
          $env:EXPLORER2_TRACE = "1"
          $log = "$env:RUNNER_TEMP\ui.log"
          $p = Start-Process -FilePath (Resolve-Path "target/release/explorer2.exe").Path -ArgumentList "`"$dir`"" -PassThru -RedirectStandardError $log
          Start-Sleep -Seconds 10
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          $text = Get-Content $log -Raw
          $text
          if (-not $alive) { throw "explorer2 exited early (exit code $($p.ExitCode))" }
          if ($text -notmatch 'done gen=1 total=100000 shown=100000') { throw "100k folder not fully loaded" }
          if ($text -match '(?i)panic') { throw "panic in log" }
          $fp = [regex]::Match($text, 'first paint gen=1 rows=\d+ after ([\d.]+)(ms|µs|s)')
          "first paint: $($fp.Groups[1].Value) $($fp.Groups[2].Value)"
      - uses: actions/upload-artifact@v4
        with: { name: explorer2-windows-x64, path: target/release/explorer2.exe }
