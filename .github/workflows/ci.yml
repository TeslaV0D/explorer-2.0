name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Linux UI deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Benchmark 100k folder (budgets from PLAN-BASICS)
        run: cargo run --release -p explorer-fs --example bench -- --files 100000 --runs 9 --assert
  e2e-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: UI deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev xvfb xdotool imagemagick
      - run: cargo build --release -p explorer2
      - name: E2E UI test (Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/e2e.sh "$PWD/target/release/explorer2" "$RUNNER_TEMP/e2e"
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshots, path: "${{ runner.temp }}/e2e/*.png" }
  build-windows-release:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p explorer2
      - name: Smoke test exe (starts, prints version, manifest embedded)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/release/explorer2.exe").Path
          # GUI-subsystem exe: PowerShell does not wait for it, so use Start-Process -Wait
          $p = Start-Process -FilePath $exe -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput "$env:RUNNER_TEMP\ver.txt"
          $out = (Get-Content "$env:RUNNER_TEMP\ver.txt" -Raw).Trim()
          if ($p.ExitCode -ne 0 -or $out -notmatch '^explorer2 \d+\.\d+\.\d+') { throw "bad --version (exit $($p.ExitCode)): '$out'" }
          $text = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exe))
          foreach ($needle in 'PerMonitorV2','longPathAware') {
            if (-not $text.Contains($needle)) { throw "manifest missing: $needle" }
          }
          "$out; size=$((Get-Item $exe).Length) bytes"
      - name: UI smoke test (real window, 100k folder, Windows fast path; default vs software renderer)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\big"
          cargo run --release -q -p explorer-fs --example bench -- --create-in $dir --files 100000
          $exe = (Resolve-Path "target/release/explorer2.exe").Path
          $env:EXPLORER2_TRACE = "1"
          foreach ($backend in @("", "winit-software")) {
            $env:SLINT_BACKEND = $backend
            $label = if ($backend) { $backend } else { "default" }
            $log = "$env:RUNNER_TEMP\ui-$label.log"
            $p = Start-Process -FilePath $exe -ArgumentList "`"$dir`"" -PassThru -RedirectStandardError $log
            Start-Sleep -Seconds 10
            $alive = -not $p.HasExited
            if ($alive) { Stop-Process -Id $p.Id -Force }
            $text = Get-Content $log -Raw
            "----- renderer: $label"
            $text
            if (-not $alive) { throw "[$label] explorer2 exited early (exit code $($p.ExitCode))" }
            if ($text -notmatch 'done gen=1 total=100000 shown=100000') { throw "[$label] 100k folder not fully loaded" }
            if ($text -match '(?i)panic') { throw "[$label] panic in log" }
            function Field($line, $name) {
              $m = [regex]::Match($text, $line + '.*? ' + $name + '=([\d.]+)ms')
              if (-not $m.Success) { throw "[$label] trace field missing: $line $name" }
              [double]::Parse($m.Groups[1].Value, [cultureinfo]::InvariantCulture)
            }
            # M1 budgets: data latency, measured on the loader thread
            $first = Field 'first paint gen=1 ' 'data_ready'; $all = Field 'done gen=1 ' 'data_ready'
            # Cold start to visible content (M8 budget, reported only)
            $cold = Field 'first paint gen=1 ' 'at'
            "[$label] first rows ready: $first ms | all 100k ready: $all ms | cold start to content: $cold ms"
            if ($first -gt 100) { throw "[$label] first rows budget exceeded: $first ms > 100 ms" }
            if ($all -gt 1000) { throw "[$label] full load budget exceeded: $all ms > 1000 ms" }
          }
      - uses: actions/upload-artifact@v4
        with: { name: explorer2-windows-x64, path: target/release/explorer2.exe }
