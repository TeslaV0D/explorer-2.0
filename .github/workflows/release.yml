name: release
# Publishes a GitHub release (Explorer2-Setup-<v>-x64.exe, portable ZIP,
# SHA256SUMS.txt) for the version in Cargo.toml:
# - automatically when a push to main or a claude/** branch carries a version
#   that has no release yet (= "raise the version" is the whole release step;
#   the workflow creates the tag v<version> itself),
# - on a pushed tag v<version>, or by hand (workflow_dispatch).
# The setup is smoke-tested before anything is published; the same commit runs
# the full CI (ci.yml) as well.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: [Cargo.toml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, z. B. v0.1.0 (muss zur Version in Cargo.toml passen)"
        required: true
permissions:
  contents: write
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: windows-latest
    env:
      EXPLORER2_INDEX: "off"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version + is there a release already?
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$v"
          $given = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG }
                   elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $tag }
          if ($given -ne $tag) { throw "tag $given does not match Cargo.toml version $v" }
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $skip = $exists -and $env:GITHUB_REF_TYPE -ne 'tag' -and $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch'
          Write-Host "version $v, release exists: $exists, skip: $skip"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - if: steps.v.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.v.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - name: Build
        if: steps.v.outputs.skip != 'true'
        run: |
          cargo build --release -p explorer2
          cargo build --release -p explorer-integrate --bins
      - name: Setup + smoke test + packages
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        run: pwsh -File scripts/release-package.ps1 target/release dist "$env:RUNNER_TEMP\release"
      - if: steps.v.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: explorer2-release
          path: dist/*
      - name: Publish GitHub release
        if: steps.v.outputs.skip != 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          $v = $env:TAG.TrimStart('v')
          (Get-Content scripts/release-notes.md -Raw).Replace('@VERSION@', $v) | Set-Content "$env:RUNNER_TEMP\notes.md" -Encoding utf8
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG (Get-ChildItem dist).FullName --clobber
          } else {
            gh release create $env:TAG (Get-ChildItem dist).FullName --target $env:GITHUB_SHA `
              --title "Explorer 2.0 $env:TAG (Beta)" --notes-file "$env:RUNNER_TEMP\notes.md"
          }
          if ($LASTEXITCODE) { throw "gh release failed" }
